<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graficaciones 2D - Nave Espacial Vectorial</title>
    <style>
        body {
            background-color: #121216;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        canvas {
            border: 2px solid #333;
            background-color: #191923;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }
        .instrucciones {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h2>Simulación 2D - Nave Espacial Vectorial</h2>
    <canvas id="lienzo" width="800" height="600"></canvas>
    <div class="instrucciones">
        Controles: <b>A / D</b> o <b>Flechas</b> para rotar | <b>W</b> o <b>Flecha Arriba</b> para avanzar | <b>Espacio</b> para disparar
    </div>

    <script>
        const canvas = document.getElementById("lienzo");
        const ctx = canvas.getContext("2d");

        const ANCHO = 800;
        const ALTO = 600;

        // Modelo local de la nave
        const modeloTriangulo = [
            { x: 0, y: -25 },
            { x: -18, y: 20 },
            { x: 18, y: 20 }
        ];

        // Estado de la nave
        let posX = 400.0;
        let posY = 300.0;
        let angulo = 0.0; // En grados
        const escala = 1.0;

        const velocidadNave = 180;
        const velocidadGiro = 180;

        // Proyectiles
        const proyectiles = [];
        const velocidadProyectil = 400;
        const cooldownDisparo = 250; // ms
        let ultimoDisparo = 0;
        const vidaProyectil = 2000; // ms

        // Estado del teclado
        const teclas = {};
        window.addEventListener("keydown", (e) => teclas[e.code] = true);
        window.addEventListener("keyup", (e) => teclas[e.code] = false);

        // Transformación geométrica 2D
        function transformarVertice(v, px, py, esc, angGrados) {
            let x = v.x * esc;
            let y = v.y * esc;

            let rad = angGrados * (Math.PI / 180);
            let xRot = x * Math.cos(rad) - y * Math.sin(rad);
            let yRot = x * Math.sin(rad) + y * Math.cos(rad);

            return {
                x: xRot + px,
                y: yRot + py
            };
        }

        let ultimoTiempo = performance.now();

        // Bucle principal de renderizado
        function buclePrincipal(tiempoActual) {
            let dt = (tiempoActual - ultimoTiempo) / 1000.0;
            ultimoTiempo = tiempoActual;
            dt = Math.min(dt, 0.05); // Evitar grandes saltos de tiempo

            // 1. Limpiar pantalla
            ctx.fillStyle = "#191923";
            ctx.fillRect(0, 0, ANCHO, ALTO);

            // 2. Controles de rotación
            if (teclas["KeyA"] || teclas["ArrowLeft"]) {
                angulo -= velocidadGiro * dt;
            }
            if (teclas["KeyD"] || teclas["ArrowRight"]) {
                angulo += velocidadGiro * dt;
            }

            // 3. Avance vectorial
            let rad = angulo * (Math.PI / 180);
            if (teclas["KeyW"] || teclas["ArrowUp"]) {
                posX += Math.sin(rad) * velocidadNave * dt;
                posY -= Math.cos(rad) * velocidadNave * dt;
            }

            // 4. Pantalla envolvente (Screen Wrapping)
            if (posX < 0) posX = ANCHO;
            else if (posX > ANCHO) posX = 0;

            if (posY < 0) posY = ALTO;
            else if (posY > ALTO) posY = 0;

            // 5. Disparos
            if (teclas["Space"]) {
                if (tiempoActual - ultimoDisparo >= cooldownDisparo) {
                    let punta = transformarVertice(modeloTriangulo[0], posX, posY, escala, angulo);
                    let vx = Math.sin(rad) * velocidadProyectil;
                    let vy = -Math.cos(rad) * velocidadProyectil;

                    proyectiles.push({
                        x: punta.x,
                        y: punta.y,
                        vx: vx,
                        vy: vy,
                        vida: vidaProyectil
                    });

                    ultimoDisparo = tiempoActual;
                }
            }

            // 6. Actualizar y dibujar proyectiles
            for (let i = proyectiles.length - 1; i >= 0; i--) {
                let p = proyectiles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vida -= dt * 1000;

                let fueraDePantalla = p.x < 0 || p.x > ANCHO || p.y < 0 || p.y > ALTO;

                if (fueraDePantalla || p.vida <= 0) {
                    proyectiles.splice(i, 1);
                    continue;
                }

                // Dibujar proyectil
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = "#ffdc46";
                ctx.fill();
                ctx.closePath();
            }

            // 7. Transformar y dibujar la nave
            let verticesPantalla = modeloTriangulo.map(v => 
                transformarVertice(v, posX, posY, escala, angulo)
            );

            ctx.beginPath();
            ctx.moveTo(verticesPantalla[0].x, verticesPantalla[0].y);
            ctx.lineTo(verticesPantalla[1].x, verticesPantalla[1].y);
            ctx.lineTo(verticesPantalla[2].x, verticesPantalla[2].y);
            ctx.closePath();

            ctx.strokeStyle = "#32ff96";
            ctx.lineWidth = 2;
            ctx.stroke();

            requestAnimationFrame(buclePrincipal);
        }

        requestAnimationFrame(buclePrincipal);
    </script>
</body>
</html>
